<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIAP-2 - Classificação Internacional de Atenção Primária</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/ciap2-system/style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <i class="fas fa-stethoscope" aria-hidden="true"></i>
                <h1>CIAP-2 <span>Classificação Internacional de Atenção Primária</span></h1>
            </div>
            <div class="search-box" role="search">
                <input type="text" id="searchInput" placeholder="Buscar por código ou nome..." aria-label="Buscar por código ou nome" onkeypress="if(event.key==='Enter') buscarCIAP2()">
                <button type="button" onclick="buscarCIAP2()" title="Buscar" aria-label="Buscar"><i class="fas fa-search" aria-hidden="true"></i></button>
                <button type="button" onclick="limparBuscaCIAP2()" class="btn-clear" title="Limpar busca" aria-label="Limpar busca"><i class="fas fa-times" aria-hidden="true"></i></button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="tabs" id="tabsContainer" role="tablist" aria-label="Capítulos CIAP-2">
            <button type="button" class="tab-btn active" data-capitulo="A" onclick="carregarCapitulo('A', this)"><i class="fas fa-notes-medical" aria-hidden="true"></i> A<span class="badge">99</span></button>
            <button type="button" class="tab-btn" data-capitulo="B" onclick="carregarCapitulo('B', this)"><i class="fas fa-droplet" aria-hidden="true"></i> B<span class="badge">29</span></button>
            <button type="button" class="tab-btn" data-capitulo="D" onclick="carregarCapitulo('D', this)"><i class="fas fa-stomach" aria-hidden="true"></i> D<span class="badge">60</span></button>
            <button type="button" class="tab-btn" data-capitulo="F" onclick="carregarCapitulo('F', this)"><i class="fas fa-eye" aria-hidden="true"></i> F<span class="badge">30</span></button>
            <button type="button" class="tab-btn" data-capitulo="H" onclick="carregarCapitulo('H', this)"><i class="fas fa-ear-listen" aria-hidden="true"></i> H<span class="badge">26</span></button>
            <button type="button" class="tab-btn" data-capitulo="K" onclick="carregarCapitulo('K', this)"><i class="fas fa-heart" aria-hidden="true"></i> K<span class="badge">46</span></button>
            <button type="button" class="tab-btn" data-capitulo="L" onclick="carregarCapitulo('L', this)"><i class="fas fa-bone" aria-hidden="true"></i> L<span class="badge">55</span></button>
            <button type="button" class="tab-btn" data-capitulo="N" onclick="carregarCapitulo('N', this)"><i class="fas fa-brain" aria-hidden="true"></i> N<span class="badge">38</span></button>
            <button type="button" class="tab-btn" data-capitulo="P" onclick="carregarCapitulo('P', this)"><i class="fas fa-face-frown" aria-hidden="true"></i> P<span class="badge">54</span></button>
            <button type="button" class="tab-btn" data-capitulo="R" onclick="carregarCapitulo('R', this)"><i class="fas fa-lungs" aria-hidden="true"></i> R<span class="badge">44</span></button>
            <button type="button" class="tab-btn" data-capitulo="S" onclick="carregarCapitulo('S', this)"><i class="fas fa-hand" aria-hidden="true"></i> S<span class="badge">43</span></button>
            <button type="button" class="tab-btn" data-capitulo="T" onclick="carregarCapitulo('T', this)"><i class="fas fa-flask" aria-hidden="true"></i> T<span class="badge">35</span></button>
            <button type="button" class="tab-btn" data-capitulo="U" onclick="carregarCapitulo('U', this)"><i class="fas fa-bladder" aria-hidden="true"></i> U<span class="badge">35</span></button>
            <button type="button" class="tab-btn" data-capitulo="W" onclick="carregarCapitulo('W', this)"><i class="fas fa-baby" aria-hidden="true"></i> W<span class="badge">42</span></button>
            <button type="button" class="tab-btn" data-capitulo="X" onclick="carregarCapitulo('X', this)"><i class="fas fa-venus" aria-hidden="true"></i> X<span class="badge">45</span></button>
            <button type="button" class="tab-btn" data-capitulo="Y" onclick="carregarCapitulo('Y', this)"><i class="fas fa-mars" aria-hidden="true"></i> Y<span class="badge">37</span></button>
            <button type="button" class="tab-btn" data-capitulo="Z" onclick="carregarCapitulo('Z', this)"><i class="fas fa-people-group" aria-hidden="true"></i> Z<span class="badge">38</span></button>
        </div>

        <div class="component-info" id="componentInfo">
            <div class="info-left">
                <span id="capituloNome">Geral e Inespecífico</span>
                <span id="capituloDescricao">Problemas gerais, sintomas inespecíficos e condições sistêmicas</span>
            </div>
            <span id="totalItens">99 rubricas</span>
        </div>

        <div class="content" id="content">
            <div class="loading">
                <i class="fas fa-spinner fa-spin" aria-hidden="true"></i>
                <p>Carregando dados...</p>
            </div>
        </div>

        <div class="stats-footer" id="statsFooter">
            <div class="stat-item"><i class="fas fa-list" aria-hidden="true"></i><span id="totalRubricas">0</span> rubricas neste capítulo</div>
            <div class="stat-item"><i class="fas fa-book" aria-hidden="true"></i><span id="totalCapitulos">17</span> capítulos</div>
            <div class="stat-item"><i class="fas fa-clock" aria-hidden="true"></i><span id="ultimaAtualizacao">Carregado</span></div>
        </div>
    </main>

    <div class="modal" id="detalhesModal" role="dialog" aria-modal="true" aria-label="Detalhes da rubrica">
        <div class="modal-content">
            <button type="button" class="modal-close" onclick="fecharModalCIAP2()" aria-label="Fechar detalhes">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="/ciap2-system/data.js"></script>
    <script src="/ciap2-system/app.js"></script>
</body>
</html>
