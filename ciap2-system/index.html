<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIAP-2 - Classificação Internacional de Atenção Primária</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            color: #2c3e50;
            min-height: 100vh;
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ===== HEADER ===== */
        header {
            background: linear-gradient(135deg, #0d6e4b, #1a8c5e);
            color: white;
            padding: 16px 0;
            box-shadow: 0 4px 20px rgba(13, 110, 75, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo i {
            font-size: 32px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .logo h1 span {
            font-weight: 300;
            font-size: 14px;
            opacity: 0.85;
            display: block;
        }

        /* ===== SEARCH ===== */
        .search-box {
            display: flex;
            gap: 5px;
            background: rgba(255,255,255,0.15);
            padding: 4px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            align-items: center;
        }

        .search-box input {
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            width: 280px;
            font-size: 15px;
            outline: none;
            background: rgba(255,255,255,0.9);
            transition: all 0.3s;
        }

        .search-box input:focus {
            background: white;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
            width: 320px;
        }

        .search-box button {
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 10px 18px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
        }

        .search-box button:hover {
            background: rgba(255,255,255,0.35);
            transform: scale(1.05);
        }

        .btn-clear {
            background: rgba(255,255,255,0.1) !important;
            padding: 10px 12px !important;
        }

        .btn-clear:hover {
            background: rgba(231, 76, 60, 0.6) !important;
        }

        /* ===== TABS ===== */
        .tabs {
            display: flex;
            gap: 6px;
            margin: 25px 0 0 0;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px 10px 0 0;
            background: #e8ecf2;
            color: #5d6d7e;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 70px;
            max-width: 120px;
            text-align: center;
            position: relative;
        }

        .tab-btn i {
            margin-right: 6px;
        }

        .tab-btn:hover {
            background: #d5dce6;
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: white;
            color: #0d6e4b;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.08);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 20%;
            right: 20%;
            height: 3px;
            background: #1a8c5e;
            border-radius: 2px;
        }

        .tab-btn .badge {
            display: inline-block;
            background: #1a8c5e;
            color: white;
            border-radius: 50%;
            padding: 1px 7px;
            font-size: 10px;
            margin-left: 4px;
            font-weight: 700;
        }

        .tab-btn.active .badge {
            background: #0d6e4b;
        }

        /* ===== COMPONENT INFO ===== */
        .component-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: white;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .component-info .info-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .component-info #capituloNome {
            font-size: 18px;
            font-weight: 600;
            color: #0d6e4b;
        }

        .component-info #capituloDescricao {
            font-size: 14px;
            color: #7f8c8d;
        }

        .component-info #totalItens {
            font-size: 14px;
            color: #7f8c8d;
            background: #f0f2f5;
            padding: 4px 15px;
            border-radius: 20px;
            white-space: nowrap;
        }

        /* ===== CONTENT ===== */
        .content {
            background: white;
            border-radius: 12px;
            padding: 25px 30px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            min-height: 450px;
            max-height: 65vh;
            overflow-y: auto;
        }

        .content::-webkit-scrollbar {
            width: 8px;
        }

        .content::-webkit-scrollbar-track {
            background: #f0f2f5;
            border-radius: 4px;
        }

        .content::-webkit-scrollbar-thumb {
            background: #1a8c5e;
            border-radius: 4px;
        }

        /* ===== LOADING ===== */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #95a5a6;
        }

        .loading i {
            font-size: 48px;
            color: #1a8c5e;
            margin-bottom: 15px;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #95a5a6;
        }

        .empty-state i {
            font-size: 48px;
            color: #bdc3c7;
            margin-bottom: 15px;
        }

        /* ===== CAPÍTULO HEADER ===== */
        .capitulo-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f2f5;
        }

        .capitulo-header h2 {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            color: #2c3e50;
        }

        .capitulo-badge {
            background: #0d6e4b;
            color: white;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
        }

        .capitulo-descricao {
            margin-top: 8px;
            color: #7f8c8d;
            font-size: 15px;
            padding-left: 50px;
        }

        /* ===== LEGENDA ===== */
        .legenda {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px 16px;
            background: #f8fafc;
            border-radius: 8px;
            margin-bottom: 20px;
            align-items: center;
        }

        .legenda-titulo {
            font-weight: 600;
            font-size: 13px;
            color: #5d6d7e;
        }

        .legenda-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #555;
        }

        .legenda-cor {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        /* ===== COMPONENTE GRUPO ===== */
        .componente-grupo {
            border-left: 4px solid #1a8c5e;
            margin-bottom: 20px;
            border-radius: 0 8px 8px 0;
            overflow: hidden;
        }

        .componente-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: #1a8c5e20;
            flex-wrap: wrap;
        }

        .componente-numero {
            background: #1a8c5e;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
        }

        .componente-nome {
            font-weight: 600;
            font-size: 15px;
            color: #2c3e50;
            flex: 1;
        }

        .componente-total {
            font-size: 12px;
            color: #7f8c8d;
            background: white;
            padding: 2px 12px;
            border-radius: 12px;
        }

        /* ===== RUBRICAS GRID ===== */
        .rubricas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 6px;
            padding: 10px;
        }

        .rubrica-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #f0f2f5;
            background: white;
        }

        .rubrica-item:hover {
            background: #f0f7fe;
            border-color: #1a8c5e;
            transform: translateX(4px);
        }

        .rubrica-codigo {
            font-weight: 700;
            color: #0d6e4b;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            min-width: 40px;
            background: #f0f2f5;
            padding: 0 6px;
            border-radius: 4px;
            text-align: center;
        }

        .rubrica-nome {
            flex: 1;
            font-size: 13px;
            color: #2c3e50;
        }

        .rubrica-comp {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        .btn-detalhes {
            background: none;
            border: none;
            color: #1a8c5e;
            cursor: pointer;
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
            opacity: 0.6;
        }

        .btn-detalhes:hover {
            background: #1a8c5e;
            color: white;
            opacity: 1;
        }

        /* ===== BUSCA HEADER ===== */
        .busca-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f2f5;
        }

        .busca-header h3 {
            font-size: 20px;
            color: #2c3e50;
        }

        /* ===== STATS FOOTER ===== */
        .stats-footer {
            display: flex;
            gap: 30px;
            padding: 15px 20px;
            margin-top: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #5d6d7e;
            font-size: 14px;
        }

        .stat-item i {
            color: #1a8c5e;
            font-size: 18px;
        }

        .stat-item span {
            font-weight: 700;
            color: #0d6e4b;
        }

        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 35px;
            max-width: 550px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 30px;
            font-weight: 300;
            cursor: pointer;
            color: #95a5a6;
            transition: all 0.2s;
        }

        .modal-close:hover {
            color: #e74c3c;
            transform: rotate(90deg);
        }

        .modal-body {
            margin-top: 10px;
        }

        .modal-header {
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .modal-codigo {
            font-family: 'Courier New', monospace;
            font-size: 28px;
            font-weight: 700;
            color: #0d6e4b;
        }

        .modal-header h3 {
            font-size: 20px;
            color: #2c3e50;
            margin-top: 5px;
        }

        .detail-item {
            padding: 10px 0;
            border-bottom: 1px solid #f0f2f5;
        }

        .detail-label {
            font-weight: 600;
            color: #0d6e4b;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-value {
            font-size: 15px;
            margin-top: 3px;
            color: #2c3e50;
        }

        .detail-value.code {
            font-family: 'Courier New', monospace;
            color: #1a8c5e;
            font-weight: 700;
        }

        .componente-tag {
            display: inline-block;
            padding: 3px 14px;
            border-radius: 20px;
            color: white;
            font-size: 13px;
            font-weight: 600;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            .logo h1 span {
                display: none;
            }

            .rubricas-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            header .container {
                flex-direction: column;
                align-items: stretch;
            }

            .logo {
                justify-content: center;
            }

            .search-box {
                width: 100%;
            }

            .search-box input {
                width: 100%;
                flex: 1;
            }

            .search-box input:focus {
                width: 100%;
            }

            .tab-btn {
                font-size: 11px;
                padding: 8px 12px;
                min-width: 50px;
                max-width: 100%;
                flex: 1;
            }

            .tab-btn i {
                margin-right: 3px;
            }

            .tab-btn .badge {
                display: none;
            }

            .component-info {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .component-info .info-left {
                width: 100%;
            }

            .content {
                padding: 15px;
                max-height: 55vh;
            }

            .capitulo-header h2 {
                font-size: 18px;
                flex-wrap: wrap;
            }

            .capitulo-descricao {
                padding-left: 0;
            }

            .componente-header {
                padding: 8px 12px;
            }

            .componente-nome {
                font-size: 13px;
            }

            .rubrica-item {
                padding: 6px 10px;
                flex-wrap: wrap;
            }

            .stats-footer {
                gap: 15px;
                font-size: 12px;
            }

            .modal-content {
                padding: 25px;
                margin: 10px;
            }
        }

        @media (max-width: 480px) {
            .logo h1 {
                font-size: 18px;
            }

            .tab-btn {
                font-size: 10px;
                padding: 6px 8px;
                min-width: 35px;
            }

            .rubrica-codigo {
                font-size: 11px;
                min-width: 32px;
            }

            .rubrica-nome {
                font-size: 12px;
            }

            .modal-codigo {
                font-size: 22px;
            }

            .modal-header h3 {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header>
        <div class="container">
            <div class="logo">
                <i class="fas fa-stethoscope"></i>
                <h1>CIAP-2 <span>Classificação Internacional de Atenção Primária</span></h1>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar por código ou nome..." 
                       onkeypress="if(event.key==='Enter') buscarCIAP2()">
                <button onclick="buscarCIAP2()" title="Buscar"><i class="fas fa-search"></i></button>
                <button onclick="limparBusca()" class="btn-clear" title="Limpar busca"><i class="fas fa-times"></i></button>
            </div>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="container">

        <!-- Tabs -->
        <div class="tabs" id="tabsContainer">
            <button class="tab-btn active" data-capitulo="A" onclick="carregarCapitulo('A', this)">
                <i class="fas fa-notes-medical"></i> A<span class="badge">99</span>
            </button>
            <button class="tab-btn" data-capitulo="B" onclick="carregarCapitulo('B', this)">
                <i class="fas fa-droplet"></i> B<span class="badge">29</span>
            </button>
            <button class="tab-btn" data-capitulo="D" onclick="carregarCapitulo('D', this)">
                <i class="fas fa-stomach"></i> D<span class="badge">60</span>
            </button>
            <button class="tab-btn" data-capitulo="F" onclick="carregarCapitulo('F', this)">
                <i class="fas fa-eye"></i> F<span class="badge">30</span>
            </button>
            <button class="tab-btn" data-capitulo="H" onclick="carregarCapitulo('H', this)">
                <i class="fas fa-ear-listen"></i> H<span class="badge">26</span>
            </button>
            <button class="tab-btn" data-capitulo="K" onclick="carregarCapitulo('K', this)">
                <i class="fas fa-heart"></i> K<span class="badge">46</span>
            </button>
            <button class="tab-btn" data-capitulo="L" onclick="carregarCapitulo('L', this)">
                <i class="fas fa-bone"></i> L<span class="badge">55</span>
            </button>
            <button class="tab-btn" data-capitulo="N" onclick="carregarCapitulo('N', this)">
                <i class="fas fa-brain"></i> N<span class="badge">38</span>
            </button>
            <button class="tab-btn" data-capitulo="P" onclick="carregarCapitulo('P', this)">
                <i class="fas fa-face-frown"></i> P<span class="badge">54</span>
            </button>
            <button class="tab-btn" data-capitulo="R" onclick="carregarCapitulo('R', this)">
                <i class="fas fa-lungs"></i> R<span class="badge">44</span>
            </button>
            <button class="tab-btn" data-capitulo="S" onclick="carregarCapitulo('S', this)">
                <i class="fas fa-hand"></i> S<span class="badge">43</span>
            </button>
            <button class="tab-btn" data-capitulo="T" onclick="carregarCapitulo('T', this)">
                <i class="fas fa-flask"></i> T<span class="badge">35</span>
            </button>
            <button class="tab-btn" data-capitulo="U" onclick="carregarCapitulo('U', this)">
                <i class="fas fa-bladder"></i> U<span class="badge">35</span>
            </button>
            <button class="tab-btn" data-capitulo="W" onclick="carregarCapitulo('W', this)">
                <i class="fas fa-baby"></i> W<span class="badge">42</span>
            </button>
            <button class="tab-btn" data-capitulo="X" onclick="carregarCapitulo('X', this)">
                <i class="fas fa-venus"></i> X<span class="badge">45</span>
            </button>
            <button class="tab-btn" data-capitulo="Y" onclick="carregarCapitulo('Y', this)">
                <i class="fas fa-mars"></i> Y<span class="badge">37</span>
            </button>
            <button class="tab-btn" data-capitulo="Z" onclick="carregarCapitulo('Z', this)">
                <i class="fas fa-people-group"></i> Z<span class="badge">38</span>
            </button>
        </div>

        <!-- Component Info -->
        <div class="component-info" id="componentInfo">
            <div class="info-left">
                <span id="capituloNome">Geral e Inespecífico</span>
                <span id="capituloDescricao" style="font-size: 13px; color: #7f8c8d;">Problemas gerais, sintomas inespecíficos e condições sistêmicas</span>
            </div>
            <span id="totalItens">99 rubricas</span>
        </div>

        <!-- Content -->
        <div class="content" id="content">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Carregando dados...</p>
            </div>
        </div>

        <!-- Stats Footer -->
        <div class="stats-footer" id="statsFooter">
            <div class="stat-item">
                <i class="fas fa-list"></i>
                <span id="totalRubricas">0</span> rubricas neste capítulo
            </div>
            <div class="stat-item">
                <i class="fas fa-book"></i>
                <span id="totalCapitulos">17</span> capítulos
            </div>
            <div class="stat-item">
                <i class="fas fa-clock"></i>
                <span id="ultimaAtualizacao">Carregado</span>
            </div>
        </div>
    </main>

    <!-- ===== MODAL ===== -->
    <div class="modal" id="detalhesModal">
        <div class="modal-content">
            <span class="modal-close" onclick="fecharModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="data.js"></script>
    <script src="app.js"></script>

</body>
</html>
